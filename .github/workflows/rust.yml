name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: echo "targets=$(cat .github/targets.json | jq -c)" >> $GITHUB_OUTPUT

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --rust-version --workspace --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    needs: [setup, fmt, clippy, msrv]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile ci --all-features
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: target/nextest/ci/junit.xml

  coverage:
    name: Coverage
    needs: [msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  web:
    name: Web
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install web dependencies
        run: bun ci
        working-directory: web
      - name: Build browser WASM
        run: bun run build:wasm
        working-directory: web
      - name: Check web application
        run: bun run check
        working-directory: web
      - name: Run web unit tests
        run: bun run test
        working-directory: web
      - name: Build static application
        run: bun run build:app
        working-directory: web
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - name: Run browser tests
        run: bun run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: sdocx-web
          path: web/build
          if-no-files-found: error

  deploy-web:
    name: Deploy web
    needs: [web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sdocx.twango.dev
    concurrency:
      group: sdocx-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdocx-web
          path: web/build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Deploy static assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: bun
          workingDirectory: web
