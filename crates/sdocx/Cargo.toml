[package]
name = "sdocx"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
description = "Reverse-engineered tooling and SDK for converting Samsung Notes (.sdocx) files"
license = "GPL-3.0"
repository = "https://github.com/twangodev/sdocx"
readme = "../../README.md"

[features]
render = ["dep:base64", "dep:svg", "dep:fontdb", "dep:rustybuzz", "dep:write-fonts", "dep:cssparser", "dep:unicode-bidi", "dep:unicode-script", "dep:unicode-linebreak", "dep:unicode-segmentation", "dep:skrifa"]
pdf = ["render", "dep:krilla", "dep:usvg", "dep:png", "dep:flate2", "dep:resvg", "dep:smallvec", "dep:tiny-skia"]
serde = ["dep:serde"]

[dependencies]
sha2 = "0.10.9"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.18"
cesu8 = "1.1.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
svg = { version = "0.18.0", optional = true }
base64 = { version = "0.22", optional = true }
fontdb = { version = "0.23.0", optional = true, default-features = false }
rustybuzz = { version = "0.20.1", optional = true }
write-fonts = { version = "0.48.1", optional = true }
cssparser = { version = "0.38.0", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
unicode-script = { version = "0.5.8", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
krilla = { version = "0.8.2", optional = true, default-features = false, features = ["raster-images"] }
flate2 = { version = "1.1", optional = true }
resvg = { version = "0.47.0", optional = true }
skrifa = { version = "0.42.0", optional = true }
smallvec = { version = "1.15.1", optional = true, features = ["union", "const_new", "write"] }
tiny-skia = { version = "0.12.0", optional = true }
usvg = { version = "0.47.0", optional = true }
png = { version = "0.18.1", optional = true }

[dev-dependencies]
roxmltree = "0.21.1"
svgtypes = "0.16.1"
lopdf = { version = "0.42.0", default-features = false }
resvg = "0.47.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[example]]
name = "ink_geometry"
required-features = ["render", "serde"]
