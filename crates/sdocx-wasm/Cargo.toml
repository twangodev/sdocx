[package]
name = "sdocx-wasm"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "WASM bindings for sdocx — parse Samsung Notes (.sdocx) files in the browser"
license = "GPL-3.0"
repository = "https://github.com/twangodev/sdocx"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sdocx = { version = "0.6.0", path = "../sdocx", features = ["render", "serde"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
